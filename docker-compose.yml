
# ─────────────────────────────────────────────────
#  RegRadar — Phase 1 MVP
#  Services: API · PostgreSQL · Redis · Celery Worker · Celery Beat
# ─────────────────────────────────────────────────

services:

  # ── 1. FastAPI Application ──────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regradar_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app                  # Live reload — edits reflect instantly
    ports:
      - "8000:8000"                     # API available at http://localhost:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://regradar:regradar_pass@db:5432/regradar
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy      # Wait until Postgres is actually ready
      redis:
        condition: service_healthy
    networks:
      - regradar_net
    restart: unless-stopped

  # ── 2. Celery Worker (Background Jobs) ──────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regradar_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://regradar:regradar_pass@db:5432/regradar
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - regradar_net
    restart: unless-stopped

  # ── 3. Celery Beat (Scraper Scheduler) ──────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regradar_beat
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/celerybeat-schedule   # Persist beat schedule
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://regradar:regradar_pass@db:5432/regradar
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - regradar_net
    restart: unless-stopped

  # ── 4. PostgreSQL Database ───────────────────────
  db:
    image: postgres:16-alpine
    container_name: regradar_db
    environment:
      POSTGRES_USER: regradar
      POSTGRES_PASSWORD: regradar_pass
      POSTGRES_DB: regradar
    volumes:
      - postgres_data:/var/lib/postgresql/data      # Data persists across restarts
    ports:
      - "5432:5432"                                 # Access with any Postgres client
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regradar -d regradar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - regradar_net
    restart: unless-stopped

  # ── 5. Redis (Cache + Message Broker) ───────────
  redis:
    image: redis:7-alpine
    container_name: regradar_redis
    command: redis-server --appendonly yes          # Persist data to disk
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"                                 # Access with redis-cli or GUI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - regradar_net
    restart: unless-stopped

# ─────────────────────────────────────────────────
#  Volumes — data persists even when containers stop
# ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  celery_beat_data:

# ─────────────────────────────────────────────────
#  Network — all services talk to each other here
# ─────────────────────────────────────────────────
networks:
  regradar_net:
    driver: bridge